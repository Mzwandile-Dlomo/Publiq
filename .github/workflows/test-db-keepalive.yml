name: Test Database Keep Alive

on:
  schedule:
    # Keeps a Supabase test database active without querying production.
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-db-keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Query test database
    runs-on: ubuntu-latest
    environment: tst
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run keep-alive query
        run: node scripts/keep-test-db-alive.mjs
