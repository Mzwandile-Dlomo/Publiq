name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript checks
        run: npm run typecheck

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Build validation must also run for pull requests from forks, where
          # repository secrets are intentionally unavailable.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/publiq
          JWT_SECRET: ci-build-only-jwt-secret-not-used-at-runtime
          CRON_SECRET: ci-build-only-cron-secret-not-used-at-runtime
        run: npm run build

  integration-test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    # Configure E2E_DATABASE_URL as a repository Actions secret to enable this job.
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    if: ${{ env.E2E_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare the test database
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma db push

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run API integration tests
        env:
          E2E_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npm run test:integration

  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: [build]
    # Configure E2E_DATABASE_URL as a repository Actions secret to enable this job.
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    if: ${{ env.E2E_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare the test database
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma db push

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        env:
          E2E_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
